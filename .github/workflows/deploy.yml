# git push すると GitHub 側で自動的にビルドして公開してくれる仕掛け。
# 手元で npm run build する必要はありません。push だけでOK。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # GitHub の Actions 画面から手で流すこともできる
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時に2つ動いて公開が混ざらないようにする
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # _next という名前のフォルダを GitHub Pages に無視させないための目印
      - run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
